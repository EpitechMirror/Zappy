name: AI Client Build and Test

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-build.yml'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'ai/**'

jobs:
  check-ai-exists:
    runs-on: ubuntu-latest
    outputs:
      ai-exists: ${{ steps.check-ai.outputs.exists }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check if AI directory exists
      id: check-ai
      run: |
        if [ -d "ai" ]; then
          echo "AI directory found"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "AI directory not found"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

  build-and-test:
    runs-on: ubuntu-latest
    needs: check-ai-exists
    if: needs.check-ai-exists.outputs.ai-exists == 'true'
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('ai/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Verify AI structure
      run: |
        echo "🔍 Checking AI directory structure..."
        ls -la ai/
        if [ -d "ai/src" ]; then
          echo "✅ AI source directory exists"
          ls -la ai/src/
        else
          echo "❌ AI source directory missing"
          exit 1
        fi
        if [ -d "ai/tests" ]; then
          echo "✅ AI tests directory exists"
          ls -la ai/tests/
        else
          echo "❌ AI tests directory missing"
          exit 1
        fi
    
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest pytest-cov flake8 black isort
    
    - name: Install AI requirements
      run: |
        cd ai
        if [ -f "requirements.txt" ] && [ -s "requirements.txt" ]; then
          echo "📦 Installing from requirements.txt..."
          pip install -r requirements.txt
        else
          echo "📦 No requirements.txt or empty, installing basic dependencies..."
          pip install numpy
        fi
    
    - name: Verify Python imports
      run: |
        cd ai
        echo "🐍 Testing Python imports..."
        python -c "import sys; print('Python version:', sys.version)"
        python -c "import numpy; print('NumPy version:', numpy.__version__)"
        PYTHONPATH=src python -c "
        try:
            from Classes import Direction, ResourceType, ActionType, Position, GameState, Experience
            print('✅ Classes import successful')
        except ImportError as e:
            print('❌ Classes import failed:', e)
            exit(1)
        "
    
    - name: Code quality checks
      run: |
        cd ai
        echo "🔍 Running code quality checks..."
        
        # Check code formatting with black
        echo "Checking code formatting..."
        black --check --diff src/ tests/ || echo "⚠️ Code formatting issues found"
        
        # Check import sorting
        echo "Checking import sorting..."
        isort --check-only --diff src/ tests/ || echo "⚠️ Import sorting issues found"
        
        # Run flake8 for basic linting
        echo "Running flake8..."
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run unit tests
      run: |
        cd ai
        echo "🧪 Running AI unit tests..."
        
        # Set Python path and run tests
        export PYTHONPATH=src:$PYTHONPATH
        
        # Run tests with coverage
        python -m pytest tests/ \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov \
          --junitxml=test-results.xml \
          -v \
          --tb=short
    
    - name: Test executable script
      run: |
        cd ai
        echo "🚀 Testing AI executable..."
        
        # Test help functionality
        python src/zappy_ai.py --help || echo "Help command test completed"
        
        # Test argument parsing (should fail gracefully)
        python src/zappy_ai.py -p 4242 -n test_team --no-learning --help || echo "Argument parsing test completed"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          ai/test-results.xml
          ai/coverage.xml
          ai/htmlcov/
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./ai
        files: ./ai/coverage.xml
        flags: ai-client
        name: ai-client-coverage
        fail_ci_if_error: false
    
    - name: Test summary
      if: always()
      run: |
        cd ai
        echo "📊 Test Summary"
        echo "=============="
        if [ -f "test-results.xml" ]; then
          echo "✅ Test results file generated"
        fi
        if [ -f "coverage.xml" ]; then
          echo "✅ Coverage report generated"
        fi
        if [ -d "htmlcov" ]; then
          echo "✅ HTML coverage report generated"
        fi
        echo "🎉 AI build and test workflow completed!"

  notify-status:
    runs-on: ubuntu-latest
    needs: [check-ai-exists, build-and-test]
    if: always()
    
    steps:
    - name: Notify build status
      run: |
        if [ "${{ needs.check-ai-exists.outputs.ai-exists }}" == "false" ]; then
          echo "ℹ️ AI directory not found - skipping AI tests"
        elif [ "${{ needs.build-and-test.result }}" == "success" ]; then
          echo "✅ AI build and tests passed successfully!"
        elif [ "${{ needs.build-and-test.result }}" == "failure" ]; then
          echo "❌ AI build or tests failed!"
          exit 1
        elif [ "${{ needs.build-and-test.result }}" == "skipped" ]; then
          echo "⏭️ AI tests were skipped"
        else
          echo "❓ AI build status: ${{ needs.build-and-test.result }}"
        fi
