name: Zappy CI/CD Pipeline

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

jobs:
  # Code Quality Checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        cd ai
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Python linting
      run: |
        cd ai
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Python formatting check
      run: |
        cd ai
        black --check src/ tests/
        isort --check-only src/ tests/

  # Build and Test - Linux
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    needs: quality
    
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libraylib-dev \
          python3 \
          python3-pip \
          python3-venv \
          valgrind \
          lcov \
          clang
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} \
          -DBUILD_TESTS=ON \
          -DCODE_COVERAGE=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)
    
    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure --verbose
    
    - name: Memory Test (Debug only)
      if: matrix.build_type == 'Debug'
      working-directory: build
      run: |
        # Run memory tests if valgrind targets exist
        if make help | grep -q "server-test-memory"; then
          make server-test-memory
        fi
    
    - name: Generate Coverage Report
      if: matrix.build_type == 'Debug' && matrix.compiler == 'gcc'
      run: |
        cd build
        if make help | grep -q "server-coverage"; then
          make server-coverage
        fi
    
    - name: Upload Coverage
      if: matrix.build_type == 'Debug' && matrix.compiler == 'gcc'
      uses: codecov/codecov-action@v3
      with:
        files: ./build/coverage.info
        fail_ci_if_error: false

  # AI Tests
  ai-tests:
    name: AI Tests
    runs-on: ubuntu-latest
    needs: quality
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd ai
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run AI tests
      run: |
        cd ai
        python -m pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload AI Coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./ai/coverage.xml
        flags: ai
        fail_ci_if_error: false

  # Build Documentation
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Docsify CLI
      run: npm install -g docsify-cli
    
    - name: Build docs
      run: |
        cd docs
        docsify serve . --port 3000 &
        sleep 5
        # Add documentation build/validation steps here
    
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: c, cpp, python
    
    - name: Build for CodeQL
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # Release Build
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build-linux, ai-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libraylib-dev
    
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
        cmake --build build --config Release -j$(nproc)
    
    - name: Create Distribution Package
      run: |
        cd build
        make package
    
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./build/Zappy-*.tar.gz
        asset_name: zappy-${{ github.event.release.tag_name }}-linux.tar.gz
        asset_content_type: application/gzip

  # Performance Tests
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: build-linux
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libraylib-dev
    
    - name: Build Performance Tests
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
        cmake --build build --config Release -j$(nproc)
    
    - name: Run Performance Tests
      run: |
        # Add performance test commands here
        cd build
        # ./bin/performance_tests || true
    
    - name: Upload Performance Results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: build/performance_results.json
      if: always()
