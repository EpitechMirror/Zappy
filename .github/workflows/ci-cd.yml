name: Zappy CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PROJECT_NAME: zappy
  BUILD_TYPE: Release

jobs:
  # Check code quality and formatting
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format
          pip install black isort flake8

      - name: Check Python code formatting
        run: |
          cd ai
          black --check src/ tests/ || exit 1
          isort --check-only src/ tests/ || exit 1
          flake8 src/ tests/ || exit 1

      - name: Check C/C++ code formatting
        run: |
          find server gui -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
          xargs clang-format --dry-run --Werror

      - name: Run static analysis
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unusedVariable \
            server/ gui/ || true

  # Build and test on Linux
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            clang \
            make \
            cmake \
            python3 \
            python3-pip \
            python3-venv \
            valgrind \
            lcov \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            mesa-common-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            xorg-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ai/.venv
          key: ${{ runner.os }}-deps-${{ hashFiles('ai/requirements.txt') }}

      - name: Build project
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          chmod +x build.sh
          ./build.sh build

      - name: Run tests
        run: |
          ./build.sh test

      - name: Generate coverage report
        if: matrix.build_type == 'Debug' && matrix.compiler == 'gcc'
        run: |
          ./build.sh coverage

      - name: Run memory leak detection
        if: matrix.build_type == 'Debug'
        run: |
          ./build.sh memory

      - name: Upload coverage reports
        if: matrix.build_type == 'Debug' && matrix.compiler == 'gcc'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/ai_coverage/coverage.xml
          name: zappy-coverage
          fail_ci_if_error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: zappy-${{ matrix.build_type }}-${{ matrix.compiler }}
          path: |
            dist/
            coverage/
          retention-days: 30

  # Build and test on macOS
  build-macos:
    name: Build and Test (macOS)
    runs-on: macos-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          brew install gcc make cmake python3 pkg-config

      - name: Build project
        run: |
          chmod +x build.sh
          ./build.sh build

      - name: Run tests
        run: |
          ./build.sh test

  # Docker build and test
  docker:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: [build-linux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and test Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: testing
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-linux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Performance benchmarking
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [build-linux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make cmake python3 python3-pip python3-venv

      - name: Build project
        run: |
          chmod +x build.sh
          ./build.sh build

      - name: Run benchmarks
        run: |
          make benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark-results.txt

  # Release creation
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, docker, security]
    if: github.event_name == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make cmake python3 python3-pip python3-venv

      - name: Create release package
        run: |
          chmod +x build.sh
          ./build.sh release

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/zappy-*.tar.gz
          asset_name: zappy-${{ github.event.release.tag_name }}.tar.gz
          asset_content_type: application/gzip

  # Deployment to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-linux, docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here
          # docker-compose -f docker-compose.staging.yml up -d

  # Deployment to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-linux, docker, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add deployment commands here
          # docker-compose -f docker-compose.prod.yml up -d

  # Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, docker, security, benchmark]
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
        run: |
          echo "✅ Build completed successfully!"
          # Add notification logic (Slack, Discord, etc.)

      - name: Notify on failure
        if: needs.build-linux.result == 'failure' || needs.build-macos.result == 'failure'
        run: |
          echo "❌ Build failed!"
          # Add notification logic (Slack, Discord, etc.)

# Workflow cleanup
cleanup:
  name: Cleanup
  runs-on: ubuntu-latest
  needs: [notify]
  if: always()
  
  steps:
    - name: Cleanup workspace
      run: |
        echo "Cleaning up workspace..."
        # Add cleanup commands if needed
