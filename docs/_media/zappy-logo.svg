<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42b883;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#369870;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad2)" opacity="0.1"/>
  
  <!-- Main logo shape -->
  <g transform="translate(100,100)">
    <!-- Planet/World representation -->
    <circle cx="0" cy="0" r="70" fill="url(#grad1)" opacity="0.8"/>
    
    <!-- Grid lines representing the toroidal map -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.3">
      <line x1="-70" y1="-35" x2="70" y2="-35"/>
      <line x1="-70" y1="0" x2="70" y2="0"/>
      <line x1="-70" y1="35" x2="70" y2="35"/>
      <line x1="-35" y1="-70" x2="-35" y2="70"/>
      <line x1="0" y1="-70" x2="0" y2="70"/>
      <line x1="35" y1="-70" x2="35" y2="70"/>
    </g>
    
    <!-- Players/Agents represented as small circles -->
    <circle cx="-35" cy="-35" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="35" cy="-35" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="-35" cy="35" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="35" cy="35" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.9"/>
    
    <!-- Resources represented as small diamonds -->
    <g fill="#FFD700" opacity="0.8">
      <polygon points="-20,-20 -15,-25 -10,-20 -15,-15" />
      <polygon points="20,-20 25,-25 30,-20 25,-15" />
      <polygon points="-20,20 -15,15 -10,20 -15,25" />
      <polygon points="20,20 25,15 30,20 25,25" />
    </g>
  </g>
  
  <!-- Text -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#42b883">ZAPPY</text>
</svg>
